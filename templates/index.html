<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingua-Franca | Advanced Translation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200">
    <meta name="description" content="Lingua-Franca - A modern, powerful text translation application with voice controls">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="material-symbols-rounded logo-icon">translate</span>
                Lingua-Franca
            </div>
            <div class="header-controls">
                <p class="subtitle">Modern translation powered by Google</p>
                <button id="theme-toggle" class="btn btn-icon" title="Toggle dark/light mode">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </header>
        
        <main class="translation-container">
            <!-- Source text section -->
            <div class="translation-box">
                <div class="language-selector">
                    <select id="source-lang">
                        {% for code, name in languages.items() %}
                        <option value="{{ code }}" {% if code == 'auto' %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                    <button id="mic-btn" class="btn btn-icon" title="Voice input">
                        <span class="material-symbols-rounded">mic</span>
                    </button>
                </div>
                
                <textarea id="source-text" class="text-area" placeholder="Enter text to translate..."></textarea>
                
                <div class="controls">
                    <button id="translate-btn" class="btn btn-primary">
                        <span class="material-symbols-rounded">translate</span>
                        Translate
                    </button>
                    <span id="detected-language" style="display: none;"></span>
                    
                    <button id="history-btn" class="btn btn-icon" title="Translation history">
                        <span class="material-symbols-rounded">history</span>
                    </button>
                </div>
            </div>
            
            <!-- Divider with swap button -->
            <div class="divider">
                <button id="swap-btn" class="swap-btn" title="Swap languages">
                    <span class="material-symbols-rounded">swap_horiz</span>
                </button>
            </div>
            
            <!-- Target text section -->
            <div class="translation-box">
                <div class="language-selector">
                    <select id="target-lang">
                        {% for code, name in languages.items() %}
                        {% if code != 'auto' %}
                        <option value="{{ code }}" {% if code == 'en' %}selected{% endif %}>{{ name }}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                    <button id="speaker-btn" class="btn btn-icon" title="Listen to translation">
                        <span class="material-symbols-rounded">volume_up</span>
                    </button>
                </div>
                
                <textarea id="target-text" class="text-area" placeholder="Translation will appear here..." readonly></textarea>
                
                <div class="controls">
                    <button id="copy-btn" class="btn btn-primary">
                        <span class="material-symbols-rounded">content_copy</span>
                        Copy
                    </button>
                </div>
            </div>
        </main>
        
        <!-- History panel (hidden by default) -->
        <div id="history-panel" class="history-panel">
            <div class="history-header">
                <h3>Translation History</h3>
                <div>
                    <button id="clear-history" class="btn btn-icon" title="Clear history">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                    <button id="close-history" class="btn btn-icon" title="Close panel">
                        <span class="material-symbols-rounded">close</span>
                    </button>
                </div>
            </div>
            <ul id="history-list" class="history-list">
                <!-- History items will be added here dynamically -->
            </ul>
        </div>
        
        <footer class="footer">
            <p>© 2025 Lingua-Franca -  Powered by Google</p>
        </footer>
    </div>
    
    <!-- Make the LANGUAGES object available to JavaScript -->
    <script>
        const LANGUAGES = {{ languages|tojson }};
    </script>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/voice.js') }}"></script>
    
    <!-- Add copy functionality -->
    <script>
        document.getElementById('copy-btn').addEventListener('click', function() {
            const textToCopy = document.getElementById('target-text').value;
            if (textToCopy) {
                navigator.clipboard.writeText(textToCopy).then(function() {
                    const btn = document.getElementById('copy-btn');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="material-symbols-rounded">check</span>Copied!';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                    }, 2000);
                });
            }
        });
        
        // Clear history button functionality
        document.getElementById('clear-history').addEventListener('click', function() {
            if (confirm('Clear all translation history?')) {
                localStorage.removeItem('translationHistory');
                translationHistory = [];
                updateHistoryPanel();
            }
        });
        
        // Close history panel button
        document.getElementById('close-history').addEventListener('click', function() {
            document.getElementById('history-panel').classList.remove('open');
        });
    </script>
</body>
</html>
